version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fraudx_db
    environment:
      POSTGRES_USER: fraudx_user
      POSTGRES_PASSWORD: fraudx_password
      POSTGRES_DB: fraudx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudx_user -d fraudx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraudx_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
